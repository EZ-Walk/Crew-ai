[project]
name = "ragagents"
version = "0.1.0"
description = "ragagents using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.95.0,<1.0.0"
]

[project.scripts]
ragagents = "ragagents.main:run"
run_crew = "ragagents.main:run"
train = "ragagents.main:train"
replay = "ragagents.main:replay"
test = "ragagents.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
